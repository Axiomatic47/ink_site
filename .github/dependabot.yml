# Weekly dependency updates, minor and patch grouped (docs/ADMIN_CONSOLE_SECURITY_PLAN.md §2.7).
# Every function dependency runs with access to the private store, so keep the
# functions on @netlify/blobs alone and read each bump before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
